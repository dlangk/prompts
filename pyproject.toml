[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-pipeline"
version = "0.1.0"
description = "CLI tool for prompt expansion and style transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
prompt-expand = "prompt_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_pipeline"]
